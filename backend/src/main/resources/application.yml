spring:
  application:
    name: lab-booking-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lab_booking}
    username: ${DB_USERNAME:lab_booking}
    password: ${DB_PASSWORD:dev-only-password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  timezone: Asia/Shanghai
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:development-secret-must-be-replaced-1234567890}
    access-token-minutes: 15
    refresh-token-days: 7
    cookie-secure: false
  reservation:
    check-in-before-minutes: 15
    check-in-grace-minutes: 15
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-per-minute: ${RATE_LIMIT_MAX_PER_MINUTE:600}
    login-max-per-minute: ${LOGIN_RATE_LIMIT_MAX_PER_MINUTE:30}
