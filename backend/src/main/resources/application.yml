spring:
  application:
    name: lab-booking-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lab_booking}
    username: ${DB_USERNAME:lab_booking}
    password: ${DB_PASSWORD:dev-only-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  timezone: Asia/Shanghai
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:development-secret-must-be-replaced-1234567890}
    access-token-minutes: 15
    refresh-token-days: 7
    cookie-secure: false
  reservation:
    check-in-before-minutes: 15
    check-in-grace-minutes: 15
